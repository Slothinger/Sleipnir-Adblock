<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anti-Adblock</title></head>
<body>
<h1>Artikel</h1><p>Inhalt</p>
<script>
// like tarnkappe.info: complain a moment after the page noticed its ads are missing
setTimeout(() => {
    document.body.style.overflow = 'hidden';
    document.body.insertAdjacentHTML('beforeend',
        '<div id="dim" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998"></div>' +
        '<div id="nag" style="position:fixed;left:0;right:0;top:30%;background:#fff;padding:30px;z-index:9999">' +
        '<h2>Kein Bock auf Werbung?</h2><p>Dieser Hinweis erscheint, weil du einen Werbeblocker verwendest.</p></div>');
}, 1500);
</script>
</body></html>
